chroma_db_path: "data/chroma_db"
embedding_model: "all-MiniLM-L6-v2"

corrective_rag:
  llm_model: "deepseek-r1-distill-llama-70b"
  web_search_model: "gpt-5"
  temperature: 0.0
  top_k: 3
  relevance_ratio: 0.5

adaptive_rag:
  llm_model: "deepseek-r1-distill-llama-70b"
  temperature: 0.0
  standard_retrieval_top_k: 3
  multi_retrieval_first_top_k: 3
  multi_retrieval_second_top_k: 2

agentic_rag:
  llm_model: "deepseek-r1-distill-llama-70b"
  temperature: 0.0
  top_k: 3
  other_retrieval_top_k: 2

conversational_rag:
  llm_model: "gdeepseek-r1-distill-llama-70b"
  temperature: 0.0
  top_k: 5
  chat_history_length: 5

fusion_rag:
  query_generator_llm_model: "deepseek-r1-distill-llama-70b"
  query_generator_temperature: 0.3
  answer_generator_llm_model: "deepseek-r1-distill-llama-70b"
  answer_generator_temperature: 0.2
  top_k: 5

hyde_rag:
  llm_model: "deepseek-r1-distill-llama-70b"
  temperature: 0.0
  hypothetical_doc_retrieval_top_k: 3
  direct_retrieval_top_k: 3

self_rag:
  llm_model: "deepseek-r1-distill-llama-70b"
  temperature: 0.0
  top_k: 3

speculative_rag:
  drafter_llm_model: "deepseek-r1-distill-llama-70b"
  drafter_temperature: 0.7
  verifier_llm_model: "deepseek-r1-distill-llama-70b"
  verifier_temperature: 0.0
  top_k: 6

standard_rag:
  llm_model: "deepseek-r1-distill-llama-70b"
  temperature: 0.0
  top_k: 3
  